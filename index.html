<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mill</title>
<style type="text/css">
body { font-family: Arial, Helvetica, sans-serif; font-size: 26px; line-height: 1.4; margin: 0; padding: 18px; background: #ffffff; color: #111111; }
h1 { font-size: 34px; margin: 0 0 12px 0; }
#st { margin: 10px 0 16px 0; }
a.btn { display: block; margin: 14px 0; padding: 22px 4px; text-align: center; font-weight: bold; font-size: 28px; text-decoration: none; color: #111111; background: #e9e9e9; border: 2px solid #888888; }
</style>
</head>
<body>
<h1>Mill</h1>
<div id="st">Checking the laptop...</div>
<a class="btn" id="go" href="https://individually-exceptional-minnesota-cancel.trycloudflare.com/">Open the book</a>
<a class="btn" href="#" onclick="window.location.href = '?r=' + new Date().getTime(); return false;">Reload</a>
<!-- LAPTOP-ON -->
<script type="text/javascript">
var T = "https://individually-exceptional-minnesota-cancel.trycloudflare.com/";
var st = document.getElementById("st");
var gone = false;
function say(m) { if (st) { st.innerHTML = m; } }
function openIt() { if (!gone) { gone = true; say("Laptop is on. Opening..."); window.location.href = T; } }
var img = new Image();
img.onload = openIt;
img.onerror = function () { say("Can't reach the laptop. It may be off or asleep, or this page is out of date. Tap Reload. If it keeps failing, tap Open the book to see the browser's error."); };
window.setTimeout(function () { if (!gone) { say("No answer from the laptop yet. Tap Reload, or Open the book."); } }, 10000);
img.src = T + "_probe.gif?" + new Date().getTime();
</script>
</body>
</html>
